name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make curl
      - name: Install package
        run: pip install -e .
      - name: Build firmware
        working-directory: firmware/hello
        run: make deps build
      - name: Pack with a synthetic stock-like template
        run: |
          python firmware/hello/tools/synthetic_template.py -o firmware/hello/build/synthetic-template.mr
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from fb200.firmware import MrFile
          p = "firmware/hello/build/synthetic-template.mr"
          mr = MrFile.from_path(p)
          b = bytearray(mr.blocks[0].data)
          b[0x4D8:0x4DA] = b"\x72\xb6"
          b[0x434:0x43C] = bytes.fromhex("50030000a0030000")
          b[0x784:0x794] = bytes.fromhex("d407016000040000c8db0100a0040160")
          mr.blocks[0].data = bytes(b)
          open(p, "wb").write(mr.to_bytes())
          PY
          python firmware/tools/pack_vendor_image.py \
            firmware/hello/build/synthetic-template.mr \
            firmware/hello/build/fb200-hello.vectors.bin \
            firmware/hello/build/fb200-hello.blob.bin \
            -o firmware/hello/build/fb200-hello.mr --app-only
      - name: Inspect packed image
        run: fb200 fw inspect firmware/hello/build/fb200-hello.mr
      - uses: actions/upload-artifact@v4
        with:
          name: fb200-hello
          path: |
            firmware/hello/build/fb200-hello.vectors.bin
            firmware/hello/build/fb200-hello.blob.bin
            firmware/hello/build/fb200-hello.mr

  firmware-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make curl
      - name: Install package
        run: pip install -e .
      - name: Build firmware (recovery + app, no stock data)
        working-directory: firmware/audio
        run: |
          make deps
          make build VARIANT=recovery
          make build VARIANT=app
      - name: Pack the published (vendor-free) images
        run: |
          python firmware/tools/pack_images.py firmware/audio/build/fb200-recovery \
            firmware/audio/build/fb200-app -o out --version "ci-${GITHUB_SHA::7}"
          cat out/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: fb200-firmware
          path: out/

  # Boots firmware/audio on the FB200 twin and checks one knob turn,
  # the display, one footswitch, the codec, a SAI tone through the
  # effect chain, a phone get-version exchange, and a looper record that
  # ends in PLAY. The core pin drops a stale decode after a store, aligns
  # VLDR/VSTR literals, and applies limits.peripheral_tick_interval. A
  # released labwired binary does not boot this image. Apt, the firmware
  # build, and the core build are outside the time cap. The cap is the
  # labwired test process only. The gate stops at 2100 M cycles. The
  # local run printed 111.76 s. The Ubuntu runner is about three times
  # slower, so the cap is 360 s. wall_time_ms on the gate is 420000.
  open-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make
      - name: Check out labwired-core
        uses: actions/checkout@v4
        with:
          repository: w1ne/labwired-core
          ref: acc4940de4b999e703c39292be5f96bde0bc9f56
          path: labwired-core
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: labwired-core
      - name: Build labwired
        working-directory: labwired-core
        env:
          # The pedal proof stops at 2100 M cycles. This binary has to
          # finish that run inside the 360 s cap.
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          RUSTFLAGS: "-C target-cpu=native"
        run: cargo build --release -p labwired-cli
      - name: Build the open firmware
        working-directory: firmware/audio
        run: |
          make deps
          make build VARIANT=recovery
          make build VARIANT=app
      - name: Resolve the knob table
        run: python3 tools/labwired_open_fw.py
      - name: Boot the open firmware and check the pedal
        run: |
          set -o pipefail
          ./labwired-core/target/release/labwired test \
            --script build/labwired/open-boot.yaml \
            --output-dir open-pedal \
            --no-uart-stdout 2>&1 | tee open-pedal.log
          python3 - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          log = Path("open-pedal.log").read_text()
          match = re.search(
              r"PASS\s+(\d+)/(\d+) checks · open-boot · (\d+) steps · ([0-9.]+)s",
              log,
          )
          if match is None:
              sys.exit("open-pedal.log has no PASS line")
          done, total, steps, seconds = match.groups()
          seconds = float(seconds)
          print(f"PASS  {done}/{total} checks · open-boot · {steps} steps · {seconds}s")
          if done != total:
              sys.exit("not every check passed")
          if seconds > 360:
              sys.exit(f"labwired test took {seconds}s; the cap is 360s")

          result = json.loads(Path("open-pedal/result.json").read_text())
          print("status", result["status"])
          print("stop_reason", result["stop_reason"])
          observed = result["stop_reason_details"]["observed"]["value"]
          limit = result["stop_reason_details"]["triggered_limit"]["value"]
          print("cycles", observed, "limit", limit)
          if result["status"] != "pass" or result["stop_reason"] != "max_cycles":
              sys.exit("the run did not pass at max_cycles")
          if observed != limit or limit in (250_000_000, 3_400_000_000):
              sys.exit("the run used the soak budget")
          turns = [
              item
              for item in result["stimuli"]
              if item["component"] == "knob_k15_master"
          ]
          if len(turns) != 1:
              sys.exit(f"expected one MASTER turn, found {turns}")
          stimulus = turns[0]
          print(
              "turn",
              stimulus["component"],
              stimulus["value"],
              stimulus["outcome"],
              stimulus["at_cycle"],
          )
          if stimulus["outcome"] != "applied" or stimulus["value"] != 20:
              sys.exit("the MASTER knob was not turned to 20")
          required_logs = {
              ("usb1", "host", '"FB200 Audio"'),
              ("display", "text", '"0Ut"'),
              ("display", "text", '"P0b"'),
              ("sai1", "rx", "amp 8000 hz 1000"),
              ("sai1", "tx", "peak 256 tail"),
              ("lpuart5", "link", "TS+01 edr connected"),
              ("lpuart5", "link", "TL+03 ble connected"),
              ("lpuart5", "air", "phone->mcu aa 55 01 00 00 c8 cf"),
              (
                  "lpuart5",
                  "air",
                  "mcu->phone aa 55 38 00 01 46 42 32 30 30 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 56 31 2e 30 2e 30 00 56 32 2e 30 2e 30 00 56 31 2e 30 2e 30 00 41 00 b4 58",
              ),
              ("codec", "writes", "write 0x001c = 0x0002"),
              ("codec", "state", "dai slave i2s 16-bit"),
              ("codec", "state", "adcout driven"),
              ("codec", "state", "enable dac_l dac_r adc_l adc_r"),
              ("lpuart5", "at", "AT+TM -> TM+BT201-BLE"),
              ("lpuart5", "at", "AT+CN00"),
              ("lpuart5", "at", "AT+B501"),
              ("lpuart5", "at", "AT+B401"),
          }
          seen_logs = set()
          memory = []
          looper_state = None
          looper_chunks = None
          for item in result["assertions"]:
              if not item["passed"]:
                  sys.exit(f"failed check: {item}")
              body = item["assertion"]
              if "peripheral_log" in body:
                  log = body["peripheral_log"]
                  seen_logs.add((log["peripheral"], log["log"], log["contains"]))
                  print(log["peripheral"], log["log"], log["contains"])
              elif "fidelity_clean" in body:
                  print("fidelity_clean", body["fidelity_clean"])
                  if body["fidelity_clean"] is not True:
                      sys.exit("fidelity_clean did not pass")
              elif "memory_value" in body:
                  spec = body["memory_value"]
                  value = spec["expected_value"]
                  size = spec.get("size", 4)
                  if size == 2:
                      memory.append(value)
                      print(
                          f"knob {len(memory) - 1} address {spec['address']:#x} value {value:#x}"
                      )
                  elif size == 1 and value == 3:
                      looper_state = spec
                      print(f"looper state address {spec['address']:#x} value {value}")
                  elif size == 4 and value == 0x178:
                      looper_chunks = spec
                      print(f"looper chunks address {spec['address']:#x} value {value:#x}")
                  else:
                      sys.exit(f"unexpected memory check: {spec}")
          missing = sorted(required_logs - seen_logs)
          if missing:
              sys.exit(f"missing checks: {missing}")
          if len(memory) != 16:
              sys.exit(f"expected 16 knob values, found {len(memory)}")
          if len(set(memory)) != 16 or 2048 in memory or memory[-1] in (2048, 3399):
              sys.exit(f"knob values are not the distinct raw counts plus the turn: {memory}")
          if looper_state is None or looper_chunks is None:
              sys.exit("the looper state and chunk count were not checked")
          foot = [item for item in result["stimuli"] if item["component"] == "footswitch_b"]
          got = [(item["value"], item["outcome"]) for item in foot]
          print("footswitch_b", got)
          if got != [(1, "applied"), (0, "applied")]:
              sys.exit("footswitch B was not pressed and released")
          print("open-firmware pedal proof ok")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: open-pedal-result
          path: |
            open-pedal/result.json
            open-pedal.log
