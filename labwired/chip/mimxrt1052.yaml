#
# NXP i.MX RT1052 (MIMXRT1052DVL6B), Cortex-M7 r0p1 + FPv5-D16 double FPU.
# Every base address and IRQ below is read from the NXP SVD (MIMXRT1052,
# version 1.0, device MIMXRT1052DVL6B). The SVD is not in this repository;
# see docs/LABWIRED.md "SVD provenance" for its source URL and sha256.
# The register-file descriptors in peripherals/ were ingested from it.
#
# The peripheral `type:`s (imxrt_ccm, imxrt_flexspi, imxrt_lpuart, ...) are
# generic LabWired parts; this file only places them on the RT1052 map.
#
# Memory map (IMXRT1050RM, "Memory Maps"): 512 KB of FlexRAM split by
# IOMUXC_GPR17 into ITCM (0x0000_0000), DTCM (0x2000_0000) and OCRAM
# (0x2020_0000) in 32 KB banks; FlexSPI XIP at 0x6000_0000. The windows below
# are the FB200's split, which the stock firmware and ours both set
# (IOMUXC_GPR17 = 0xFFAAAAA9, GPR16 = 0x00200007; read back on the pedal):
# ITCM 4 banks (128 KB), DTCM 11 banks (352 KB), OCRAM 1 bank (32 KB). On the
# pedal nothing answers above a window: data writes are dropped, reads return
# 0, an instruction fetch bus-faults. Here such an access is unmapped, so it
# fails the run instead of passing silently (docs/FIRMWARE_BRINGUP.md,
# "Memory map").
#
# Boot: the chip ROM (not modelled) hands over to the image's vector table at
# FlexSPI 0x6000_0000 + reset_vector_offset.

name: "mimxrt1052"
arch: "arm"
core: "cortex-m7"
cpu_hz: 600_000_000
flash:
  base: 0x60000000
  size: "16384KB"
reset_vector_offset: 0x10000
# ITCM is real memory at 0x0: no STM32-style flash boot alias there.
flash_boot_alias: false
ram:
  base: 0x20000000
  size: "352KB"
memory_regions:
  - name: "itcm"
    base: 0x00000000
    size: "128KB"
  - name: "ocram"
    base: 0x20200000
    size: "32KB"
# Pad -> GPIO map (IMXRT1050RM, IOMUXC chapter, ALT5 = GPIOx_IOyy on every pad
# below). The i.MX RT pad names (GPIO_EMC_16, GPIO_B1_08) do not encode the
# port, so the label parse cannot be used. Cross-checked against the FB200
# pads in docs/UI_AND_STORAGE.md: SD_B0_00 = GPIO3_IO12,
# B1_08 = GPIO2_IO24, B1_01..03 = GPIO2_IO17..19, EMC_31 = GPIO4_IO31,
# EMC_32 = GPIO3_IO18, EMC_35 = GPIO3_IO21, AD_B0_02 = GPIO1_IO02.
