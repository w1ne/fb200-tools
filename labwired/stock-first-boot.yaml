# fb200-tools: LabWired twin of the FLAMMA FB200 - stock first-boot gate.
#
# LONG GATE. Boots the UNMODIFIED vendor firmware (V1.0.1) from a blank
# flash (no presets, no magics), as a board fresh from the factory, for
# 6.8 G cycles (11.3 s of device time at 600 MHz). It needs about 29 min
# of CPU time (Apple M4) and 1.1 GB of memory at peak; on a busy Mac it took
# 61 min of wall time. Run it by hand or nightly, not in the default loop.
# Build build/labwired/stock.elf first (docs/LABWIRED.md).
#
# What the firmware does in this window (measured on the twin, SysTick
# 1 ms = 600 000 cycles):
#   0.00 .. 0.09 G  boot to USB enumeration (stock-boot.yaml covers this)
#   0.03 .. 1.40 G  factory reset: the storage format through FlexSPI IP
#                   commands (4 KB sector erase 0x20, quad page program
#                   0x32, status poll 0x05). Magic "FB200" at F:0x82000,
#                   "B01" at F:0xB0000.
#   1.40 .. 3.20 G  a fixed delay_ms(3000) before the main loop
#   6.15 .. 6.70 G  Bluetooth module bring-up on LPUART5: AT+TM, AT+BD..,
#                   AT+BM.., AT+CN00, AT+B501, AT+B401, 150 ms apart
#   6.72 G          (script) a phone connects: EDR and BLE
#   6.73 G          (script) the phone sends "get version" over BLE
#
# The Bluetooth module is the core `bt201` part (system.yaml, id "bt"). It
# answers the AT commands as the BT201 manual says and pushes its link
# status (TS+.., TL+..). The phone is scripted: `stimuli` set the links,
# `uart_injections` with `device: bt` is data the phone writes over BLE.
#
# The expected values are storage and protocol facts from
# docs/UI_AND_STORAGE.md (sections 4 and 5), docs/PROTOCOL.md and the BT201
# manual, not bytes of the vendor image.
schema_version: "1.2"
inputs:
  firmware: "../build/labwired/stock.elf"
  system: "system.yaml"
limits:
  max_steps: 8000000000
  # AT+B401 goes out at about 6.70 G cycles; the phone runs at 6.72 G.
  max_cycles: 6800000000
  # The margin is for a busy Mac.
  wall_time_ms: 7200000
stimuli:
  # A phone pairs over classic Bluetooth (TS+01) and connects over BLE (TL+03).
  - target: { component: "bt", channel: "edr_link" }
    trigger: !after_cycles { cycles: 6720000000 }
    value: 1
  - target: { component: "bt", channel: "ble_link" }
    trigger: !after_cycles { cycles: 6720000000 }
    value: 1
uart_injections:
  # The phone app sends "get version" (fn 0x00), fb200.protocol.pack_frame(0x00)
  # (tests/test_labwired_gates.py checks these bytes).
  - uart: "lpuart5"
    device: "bt"
    bytes: [0xAA, 0x55, 0x01, 0x00, 0x00, 0xC8, 0xCF]
    trigger: !after_cycles { cycles: 6730000000 }
assertions:
  # --- Factory reset: FlexSPI IP commands ---
  # 4 KB sector erase (0x20) and quad page program (0x32) of the global
  # settings sector (magic at F:0x82000) and of the B01 sector at F:0xB0000.
  # Only the firmware's IP commands write these log lines.
  - peripheral_log: {peripheral: flexspi, log: ip, contains: "cmd 0x20 addr 0x00082000 "}
  - peripheral_log: {peripheral: flexspi, log: ip, contains: "cmd 0x32 addr 0x00082000 "}
  - peripheral_log: {peripheral: flexspi, log: ip, contains: "cmd 0x20 addr 0x000b0000 "}
  - peripheral_log: {peripheral: flexspi, log: ip, contains: "cmd 0x32 addr 0x000b0000 "}

  # --- Factory reset: the NOR array, read back through the FlexSPI AHB window ---
  # "FB20" at F:0x82000 and the "0" that ends "FB200" at F:0x82004. The flash
  # is blank (0xFF) at reset, so only a program operation writes these bytes.
  - memory_value:
      address: 0x60082000
      expected_value: 0x30324246
  - memory_value:
      address: 0x60082004
      mask: 0x000000FF
      expected_value: 0x00000030
  # "B01" at F:0xB0000.
  - memory_value:
      address: 0x600B0000
      mask: 0x00FFFFFF
      expected_value: 0x00313042

  # --- Bluetooth module bring-up on LPUART5 (115200 8N1) ---
  # The boot AT sequence, in order (UI_AND_STORAGE.md section 4).
  - uart_ordered: ["AT+TM\r\n", "AT+BD", "AT+BM", "AT+CN00\r\n", "AT+B501\r\n", "AT+B401\r\n"]
  - uart_contains: "AT+B401"
  # The module got each command and answered as the BT201 manual says: the
  # AT+TM query with the BLE name in use (the factory name: a new module
  # uses a new name only after a reset), each setting with OK.
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+TM -> TM+BT201-BLE"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+BDFB200 Audio -> OK"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+BMFB200FB200 -> OK"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+CN00 -> OK"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+B501 -> OK"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+B401 -> OK"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: " -> ", min_count: 6}

  # --- The phone ---
  - peripheral_log: {peripheral: lpuart5, log: link, contains: "TS+01 edr connected"}
  - peripheral_log: {peripheral: lpuart5, log: link, contains: "TL+03 ble connected"}
  # The firmware parsed the module's EDR status: its LPUART5 RX handler
  # (ITCM 0x3D3C) keeps the second digit of "TS+0n" at DTCM 0x2000782D, and
  # the display dot (0x19B70) blinks for '0' and is on for any other value.
  # Here '1' (0x31) from the TS+01 the module pushed on the phone link.
  - memory_value:
      address: 0x2000782C
      mask: 0x0000FF00
      expected_value: 0x00003100
  # "get version" over BLE: the module gave it to the firmware, the firmware
  # answered on the BLE transport (PROTOCOL.md 3, 5.2), the module sent the
  # answer to the phone: fn 0x01, length 0x38, product "FB200".
  - peripheral_log: {peripheral: lpuart5, log: air, contains: "phone->mcu aa 55 01 00 00 c8 cf"}
  - peripheral_log: {peripheral: lpuart5, log: air, contains: "mcu->phone aa 55 38 00 01 46 42 32 30 30 00"}

  # --- No fidelity gap, and the run did not stop early ---
  - fidelity_clean: true
  - expected_stop_reason: max_cycles
