# fb200-tools: LabWired twin of the FLAMMA FB200 - open firmware pedal gate.
#
# Boots firmware/audio. Recovery starts, checks the app slot, and launches
# the app. There is no vendor image. Build the image first. That step also
# resolves the knob table and writes the file `labwired test` runs:
#
#   make -C firmware/audio build VARIANT=recovery
#   make -C firmware/audio build VARIANT=app
#   python3 tools/labwired_open_fw.py
#   labwired test --script build/labwired/open-boot.yaml
#
# The name knobs is the file-local array in
# firmware/audio/src/ui/controls.c. The linker moves it every build, so
# this file names that array. The tool reads the address from
# fb200-app.elf and writes build/labwired/open-boot.yaml with that address.
#
# The app stores the raw ADC count. 0 is fully counter-clockwise. It does
# not subtract the count from 4095. A knob at P % reads:
#   mV = trunc(3300 * P / 100); counts = round(mV * 4095 / 3300)
# The start positions are 8 + 5 N % (system.yaml). The 16 counts differ.
# None of them is the 50 % mid-scale count 2048. At 80 M cycles a stimulus
# turns MASTER (k15) from 83 % to 20 %. At the stop its slot holds
# 819 (0x333). The start count 3399 (0xd47) is no longer there.
# The same run checks the panel. MASTER's name is shown as 0Ut, because
# the display reads the letter O as the digit 0. Footswitch B loads slot
# B, and the display then shows P0b.
# At 20 M cycles the gate drives a 1000 Hz tone into SAI1, peak sample
# 8000. The app runs that tone through the effect chain. SAI1 transmit
# then records peak 256 over the run and peak 99 over the last 256 words.
# Those levels are the engine output at this stop. They are not the raw
# word 8000 and they are not silence. MASTER is already at 20 % for that
# tail. The same tail was measured with the looper off, so it does not
# prove the loop is audible.
# After AT+B401 the gate connects a phone (EDR and BLE) and sends the
# get-version frame. The air log shows the phone bytes and the app reply.
# The reply carries firmware version V2.0.0. The phone connects while D
# and C are held. The core clock is 600 MHz, so one millisecond is
# 600 000 cycles. Slot B is loaded first. D and C are then held for one
# second. That chord enters looper mode. The image carries a short config
# block at 0x60000000. Without it the app leaves the looper off. The
# looper then erases one 64 KB block (150 ms) before a record is allowed.
# The twin flash has no erase suspend, so each erase runs to its end
# inside one main-loop pass. A tap has to stay down across two of those
# passes. Two taps of A, 500 ms each, start the record and close it. A
# short record still plays once it reaches 500 ms. The run stops at
# 2100 M cycles. The looper state byte is then PLAY (3) and the chunk
# count is 376. The display mux cannot assemble LP-, rEC, or PLY while an
# erase blocks the main loop, so those strings are not checked. The
# battery pin is 3.2 V (system.yaml). 2.5 V is a low battery and the
# panel then shows LOb.
schema_version: "1.2"
inputs:
  firmware: "../build/labwired/open.elf"
  system: "system.yaml"
limits:
  max_steps: 3200000000
  max_cycles: 2100000000
  wall_time_ms: 420000
  # The per-cycle peripheral walk dominates this run. Sixteen CPU cycles
  # between peripheral ticks still reach the checks below.
  peripheral_tick_interval: 16
stimuli:
  - target: { component: "knob_k15_master", channel: "position" }
    trigger: !after_cycles { cycles: 80000000 }
    value: 20
  - target: { component: "footswitch_b", channel: "pressed" }
    trigger: !after_cycles { cycles: 100000000 }
    value: 1
  - target: { component: "footswitch_b", channel: "pressed" }
    trigger: !after_cycles { cycles: 140000000 }
    value: 0
  # D and C down together. C's long press, with D held, enters looper mode.
  # 650 M cycles is 1.08 s, which covers the 20 ms debounce and the 1 s hold.
  - target: { component: "footswitch_d", channel: "pressed" }
    trigger: !after_cycles { cycles: 160000000 }
    value: 1
  - target: { component: "footswitch_c", channel: "pressed" }
    trigger: !after_cycles { cycles: 170000000 }
    value: 1
  - target: { component: "footswitch_c", channel: "pressed" }
    trigger: !after_cycles { cycles: 820000000 }
    value: 0
  - target: { component: "footswitch_d", channel: "pressed" }
    trigger: !after_cycles { cycles: 830000000 }
    value: 0
  # A records. Each tap is 500 ms: two main-loop passes while erase-ahead
  # is blocking. The second A closes the take. Playback follows.
  - target: { component: "footswitch_a", channel: "pressed" }
    trigger: !after_cycles { cycles: 1000000000 }
    value: 1
  - target: { component: "footswitch_a", channel: "pressed" }
    trigger: !after_cycles { cycles: 1300000000 }
    value: 0
  - target: { component: "footswitch_a", channel: "pressed" }
    trigger: !after_cycles { cycles: 1560000000 }
    value: 1
  - target: { component: "footswitch_a", channel: "pressed" }
    trigger: !after_cycles { cycles: 1860000000 }
    value: 0
  - target: { component: "sai1", channel: "rx_amp" }
    trigger: !after_cycles { cycles: 20000000 }
    value: 8000
  - target: { component: "sai1", channel: "rx_hz" }
    trigger: !after_cycles { cycles: 20000000 }
    value: 1000
  - target: { component: "bt", channel: "edr_link" }
    trigger: !after_cycles { cycles: 620000000 }
    value: 1
  - target: { component: "bt", channel: "ble_link" }
    trigger: !after_cycles { cycles: 620000000 }
    value: 1
uart_injections:
  - uart: "lpuart5"
    device: "bt"
    bytes: [0xAA, 0x55, 0x01, 0x00, 0x00, 0xC8, 0xCF]
    trigger: !after_cycles { cycles: 635000000 }
assertions:
  - peripheral_log: {peripheral: usb1, log: host, contains: "\"FB200 Audio\""}
  - peripheral_log: {peripheral: display, log: text, contains: "\"0Ut\""}
  - peripheral_log: {peripheral: display, log: text, contains: "\"P0b\""}
  - peripheral_log: {peripheral: sai1, log: rx, contains: "amp 8000 hz 1000"}
  - peripheral_log: {peripheral: sai1, log: tx, contains: "peak 256 tail 99"}
  - peripheral_log: {peripheral: lpuart5, log: link, contains: "TS+01 edr connected"}
  - peripheral_log: {peripheral: lpuart5, log: link, contains: "TL+03 ble connected"}
  - peripheral_log: {peripheral: lpuart5, log: air, contains: "phone->mcu aa 55 01 00 00 c8 cf"}
  - peripheral_log: {peripheral: lpuart5, log: air, contains: "mcu->phone aa 55 38 00 01 46 42 32 30 30 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 56 31 2e 30 2e 30 00 56 32 2e 30 2e 30 00 56 31 2e 30 2e 30 00 41 00 b4 58"}
  - peripheral_log: {peripheral: codec, log: writes, contains: "write 0x001c = 0x0002"}
  - peripheral_log: {peripheral: codec, log: state, contains: "dai slave i2s 16-bit"}
  - peripheral_log: {peripheral: codec, log: state, contains: "adcout driven"}
  - peripheral_log: {peripheral: codec, log: state, contains: "enable dac_l dac_r adc_l adc_r"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+TM -> TM+BT201-BLE"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+CN00"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+B501"}
  - peripheral_log: {peripheral: lpuart5, log: at, contains: "AT+B401"}
  # k0 THRESH, 8 %
  - memory_value: { symbol: knobs, offset: 0, size: 2, expected_value: 0x148 }
  # k1 COMP_LEVEL, 13 %
  - memory_value: { symbol: knobs, offset: 2, size: 2, expected_value: 0x214 }
  # k2 AMP, 18 %
  - memory_value: { symbol: knobs, offset: 4, size: 2, expected_value: 0x2e1 }
  # k3 GATE, 23 %
  - memory_value: { symbol: knobs, offset: 6, size: 2, expected_value: 0x3ae }
  # k4 BASS, 28 %
  - memory_value: { symbol: knobs, offset: 8, size: 2, expected_value: 0x47b }
  # k5 GAIN, 33 %
  - memory_value: { symbol: knobs, offset: 10, size: 2, expected_value: 0x547 }
  # k6 MID, 38 %
  - memory_value: { symbol: knobs, offset: 12, size: 2, expected_value: 0x614 }
  # k7 TREBLE, 43 %
  - memory_value: { symbol: knobs, offset: 14, size: 2, expected_value: 0x6e1 }
  # k8 RATE, 48 %
  - memory_value: { symbol: knobs, offset: 16, size: 2, expected_value: 0x7ae }
  # k9 MOD, 53 %
  - memory_value: { symbol: knobs, offset: 18, size: 2, expected_value: 0x87a }
  # k10 VOL, 58 %
  - memory_value: { symbol: knobs, offset: 20, size: 2, expected_value: 0x947 }
  # k11 MIX, 63 %
  - memory_value: { symbol: knobs, offset: 22, size: 2, expected_value: 0xa14 }
  # k12 REVERB, 68 %
  - memory_value: { symbol: knobs, offset: 24, size: 2, expected_value: 0xae1 }
  # k13 CAB, 73 %
  - memory_value: { symbol: knobs, offset: 26, size: 2, expected_value: 0xbad }
  # k14 REV_LEVEL, 78 %
  - memory_value: { symbol: knobs, offset: 28, size: 2, expected_value: 0xc7a }
  # k15 MASTER, turned from 83 % to 20 % (the start count would be 0xd47)
  - memory_value: { symbol: knobs, offset: 30, size: 2, expected_value: 0x333 }
  # looper_t.state. 3 is PLAY. This run reaches PLAY only by closing the record.
  - memory_value: { symbol: s_loop, offset: 8, size: 1, expected_value: 3 }
  # looper_t.chunks. 0x178 is the 376-chunk loop area.
  - memory_value: { symbol: s_loop, offset: 56, size: 4, expected_value: 0x178 }
  - fidelity_clean: true
  - expected_stop_reason: max_cycles
